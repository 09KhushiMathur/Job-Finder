<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobs | Job Finder</title>
    <link rel="icon" href="/images/JobFinder Blue Briefcase Icon.png">
    <link rel="stylesheet" href="src/style.css">
</head>

<body>
    <header>
        <section class="nav-top">
            <div class="navbar">
                <div class="logo"><img src="/images/JobFinder Dream Job Wordmark.png"
                            alt="Image" width="80px"></a></div>
                <div class="nav-left">
                    <a href="index.html">Home</a>
                    <a href="company.html">Company</a>
                    <a href="main.html">Jobs</a>
                    <a href="about.html">About Us</a>
                </div>
            </div>
        </section>
    </header>
    <section class="inputArea">
        <div class="inputJob">
            <input type="text" id="searchJob" placeholder="Find job...">
            <button id="searchBtn">Search</button>
        </div>
    </section>
    <div class="bigOne">
        <div class="result"> </div>
        <div class="help-section">
            <h1>Job refrences </h1>
        </div>
    </div>
    <template>
        <div class="cards" id="cardValue">
            <article id="jobDetails">
                <div class="job-basicInfo">
                    <h1 class="title">Something Wrong</h1>
                    <p class="jobType">Something Wrong</p>
                    <p class="category">Something Wrong</p>
                </div>
                <div class="jobSkills">
                    <h1>Required skills</h1>
                    <p class="skill">Something Wrong</p>
                </div>
                <div class="description1">
                    <h1>Job description</h1>
                    <p class="description">Something Wrong</p>

                </div>
                <div class="otherInfo">

                    <p class="closingDate">Something Wrong</p>
                    <p class="location">Something Wrong</p>
                    <p class="organization">Something Wrong</p>
                </div>
                <div class="applyUrl">
                    <a href=""></a>
                </div>

            </article>
        </div>
    </template>

    <section class="closing">
        <h2>Your Next Opportunity Starts Here!</h2>

        <p>
            Explore available jobs, discover new organizations,
            and take the next step towards your career goals.
        </p>
    </section>
    <footer>
        <p>© 2026 Job Finder. Built to make job discovery easier.</p>
    </footer>

    <script type="module" src="/src/main.js"></script>
</body>

</html>
