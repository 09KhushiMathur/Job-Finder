<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Companies | Job Finder</title>
    <link rel="icon" href="/images/JobFinder Blue Briefcase Icon.png">
    <link rel="stylesheet" href="src/style.css">

</head>

<body>

    <header>
        <nav>
            <div class="logo"><img src="/images/JobFinder Dream Job Wordmark.png"
                        alt="Image" width="70px"></a></div>

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="company.html">Company</a>
                <!-- <a href="location.html">Location</a> -->
                <a href="main.html">Jobs</a>
                <a href="about.html">About Us</a>
            </div>
        </nav>

    </header>
    <main class="company-container">

        <header class="company-header">
            <h1>Explore Companies</h1>
            <p>Discover companies and explore their available job opportunities.</p>
        </header>
    </main>
    <div class="finalResult"></div>
    <div class="jobIfo"> </div>
    <section>
        <template>
            <article id="jobCards">
                <div class="jobContainer">
                    <div class="companyLogo"> </div>
                    <p id="job"></p>
                    <button id="jobBtn">View Jobs Details</button>
                </div>
            </article>
        </template>
    </section>
    <section>
        <template id="temp">
            <div class="cards" id="cardValue">
                <article id="jobDetails">
                    <div class="job-basicInfo">
                        <h1 class="title">Something Wrong</h1>
                        <p class="jobType">Something Wrong</p>
                        <p class="category">Something Wrong</p>
                    </div>
                    <div class="jobSkills">
                        <h1>Required skills</h1>
                        <p class="skill">Something Wrong</p>
                    </div>
                    <div class="description1">
                        <h1>Job description</h1>
                        <p class="description">Something Wrong</p>

                    </div>
                    <div class="otherInfo">

                        <p class="closingDate">Something Wrong</p>
                        <p class="location">Something Wrong</p>
                        <p class="organization">Something Wrong</p>
                    </div>
                    <div class="applyUrl">
                        <a href=""></a>
                    </div>

                </article>
            </div>
        </template>
    </section>
    <script type="module" src="/src/main.js"></script>


</body>

</html>
